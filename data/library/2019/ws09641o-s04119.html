gcaption>La sismóloga más famosa de California, la profesora Lucy Jones, recordó en el 25 aniversario que Northridge "no fue un terremoto grande" para un experto. Aquel terremoto lo sintieron medio millón de personas. En el escenario catastrófico del 'Big One', que sería un terremoto de magnitud 7,8 en la falla de San Andrés, sentirían los efectos 10 millones de personas. La onda de Northridge se sintió muy lejos de los barrios del norte de Los Ángeles. Esta es una pastelería en Hollywood Boulevard, a más de 30 kilómetros del epicentro, aquella mañana del 17 de enero de 1994.Rene Macura (AP)</figcaption></figure><figure><img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAwICQsJCAwLCgsODQwOEh4UEhEREiUbHBYeLCcuLisnKyoxN0Y7MTRCNCorPVM+QkhKTk9OLztWXFVMW0ZNTkv/2wBDAQ0ODhIQEiQUFCRLMisyS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0tLS0v/wgARCAEQAZ4DASIAAhEBAxEB/8QAGgAAAwEBAQEAAAAAAAAAAAAAAQIDBAAFBv/EABYBAQEBAAAAAAAAAAAAAAAAAAABAv/aAAwDAQACEAMQAAABo01rU0mLGcTS8Wq3IRuUhB4HHjuAH6YLdj1D9Mj8CcO47hx3Dg8vBAxRqfztRcNIeaUF7oFlHWBGnHJkkbUyuSnM5W04jXqZM/S19Lyer6PvC9DU2sjB7sil8e2H7mBHV54deUBOdj1CiWWMWlqEnTvidEaLxfzdZXPYrAxVSk3YdaX83dlXV2KEmvz+SFUtS0pWXOkuL0ycbJwBemfjT0bl93mdXqDzbmg5QajleLctqzrqmT7WTNZ+qtcc42Rm8tAGoFHAHQPKBM+nox3oEbBriueGpExDRETXloH0PM9KXxCj2d3OLzkmW4YhR7w49BsLG3shNXZQbOxhfRp45T2m8O56dfO0Lr6ALdOoyUUi5I6PxmFZBnzERoinNEGhI8PNmM090jINEzzkqoLlDSWMThsjSNwAtCSOhCfWAhvxMVUkyqs9UjF74qnooElCpURjw7SJrfIxoGZxgoso8qHRqpmW86mKKijlH6YMc9GhPPPp1Xy3soq24Q3qYO28RnrcxHYTK+jjEdrrgO0mSe9TzTtCecN2eI6M8zZXz2XXTy7G5CsulZdFjAGkZrlA8SrxSrvOYHoqZEBq1oQs3JKJskaA6vWM0+EpzKwLAKpDCalE5hOsxI2cg2lqzms4nm1zMMfSzr5TafQJrTFFY9plztvzzUZGdzTTgZPSp5lV0pK1nAZydKZRTM2ahKg+/LuPR8htaedVUHNJqHGkm4uSNJiuziM5FISnl3QOE1K8YGPVjH9DzfTGhpnWWO2UZ0usuWrdZknqgRS/WUX0eXylaSNylWfmZLmougaFJqUyz2YyhTQvOzAV2SXWKysqjhCLw45WSVQ4FbmE832ATbTnsqhZc4okRWsyYdKPKUhLX5w/FSglxN46bC7VjriwaCp1RRQs/SPOX0fONejztYcr2OlvmYg9CC7YEeIlKMBUooGYgaEDeiPYzI6ynacRSiElZbOQgnnlE1axQzy2SMhrNNdBUNp1ilElW2kLCZN6KkKZiqHak0S
