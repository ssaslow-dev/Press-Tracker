<!doctype html><html><head><meta charset="utf-8"><title>식당 야외영업 연장…2026년 7월 1일까지 | 미주중앙일보</title></head><body><html> <body> <p>제시 가브리엘 가주 하원의원(46지구·민주)은 “개빈 뉴섬 주지사가 식당 야외 영업 연장 법안(AB1217)에 서명했다”고 지난 13일 밝혔다. 이에 따라 식당들은 패티오, 보도, 주차장 등을 이용한 야외 영업인 ‘알 프레스코(Al fresco)’를 계속 운영할 수 있게 됐다.</p> <p>법안을 발의했던 가브리엘 의원은 “수많은 식당이 여전히 팬데믹의 충격에서 회복하는데 어려움을 겪고 있다”며 “야외 영업은 어려운 시기에도 식당들이 문을 닫지 않도록 생명선과 같은 역할을 해왔는데 이를 연장하게 돼 기쁘다”고 전했다.</p> </body> </html></body></html>
